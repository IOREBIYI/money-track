name: PR checks

on:
  pull_request:
  workflow_dispatch:

# A new push to the same PR cancels the older, now-stale run.
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # No google-services.json or keystore here: debug builds do not need them, and CI must
      # never hold release secrets. Release-only checks stay out of PR CI on purpose.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-and-lint-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  integration-tests:
    name: Integration tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # firebase-tools provides the local Auth emulator the sign-in tests talk to.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The emulator needs KVM for acceptable speed on Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          # emulators:exec starts the Firebase Auth emulator on the runner (reachable from the
          # Android emulator as 10.0.2.2:9099), runs the command, then shuts it down. The
          # "demo-" project id guarantees nothing can touch a real Firebase project.
          script: npx --yes firebase-tools@14 emulators:exec --only auth --project demo-moneytrack "./gradlew connectedDebugAndroidTest --stacktrace"

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
